server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

spring:
  application:
    name: techmatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techmatch}
    username: ${DB_USERNAME:techmatch}
    password: ${DB_PASSWORD:techmatch}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 5s
  sql:
    init:
      mode: always
  ai:
    openai:
      base-url: ${LLM_BASE_URL:https://api.example.com}
      api-key: ${LLM_API_KEY:test-key}
      chat:
        options:
          model: ${LLM_CHAT_MODEL:deepseek-chat}
      embedding:
        options:
          model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:techmatch}

resume:
  upload:
    max-file-size-bytes: ${RESUME_MAX_FILE_SIZE_BYTES:5242880}
    allowed-extensions:
      - pdf
      - docx
  chunk:
    max-length: ${RESUME_CHUNK_MAX_LENGTH:800}
    overlap: ${RESUME_CHUNK_OVERLAP:120}
  embedding:
    dimensions: ${RESUME_EMBEDDING_DIMENSIONS:16}

jwt:
  secret: ${JWT_SECRET:change-this-secret}
  expire-seconds: ${JWT_EXPIRE_SECONDS:86400}

app:
  cors:
    allowed-origin-patterns:
      - ${CORS_ALLOWED_ORIGIN:http://localhost:*}
      - http://127.0.0.1:*
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - X-Request-Id
    allow-credentials: true

llm:
  provider: ${LLM_PROVIDER:openai-compatible}
  base-url: ${LLM_BASE_URL:https://api.example.com/v1}
  api-key: ${LLM_API_KEY:test-key}
  chat-model: ${LLM_CHAT_MODEL:deepseek-chat}
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
